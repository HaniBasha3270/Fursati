<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Form</title>
     <style>
        body {
  font-family: Arial, sans-serif;
  background: #a4befc;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.form-container {
  background: white;
  padding: 25px 30px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  width: 350px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="file"] {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 20px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #0056b3;
}

#response {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

     </style>
</head>
<body>
  <div class="form-container">
    <h2>Application Form</h2>
    <form id="applyForm">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" placeholder="Enter your name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" placeholder="Enter your phone number" required>

      <label for="position">Position Applying For:</label>
      <input type="text" id="position" placeholder="Job title" required>


      <label for="resume">Upload Resume / Document (PDF or DOCX):</label>
      <input type="file" id="resume" accept=".pdf,.doc,.docx" required>



      <button type="submit">Submit Application</button>
    </form>

    <p id="response"></p>
  </div>


    <script>
      function doPost(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const data = JSON.parse(e.postData.contents);

  sheet.appendRow([
    new Date(),
    data.fullname,
    data.email,
    data.phone,
    data.position,
    data.resumeLink || "No file"
  ]);

  return ContentService
    .createTextOutput(JSON.stringify({ result: "success", message: "Data added successfully!" }))
    .setMimeType(ContentService.MimeType.JSON);
}
        document.getElementById('applyForm').addEventListener('submit', async function(event) {
            event.preventDefault();
    
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const position = document.getElementById('position').value;
            const resumeInput = document.getElementById('resume');  
            const resumeFile = resumeInput.files[0];
            let resumeLink = "";
            if (resumeFile) {
                // Simulate file upload and get a link (in real scenario, upload to server or cloud storage)
                resumeLink = "UploadedFileLink/" + resumeFile.name;
            }
            const data = {
                fullname,
                email,
                phone,
                position,
                resumeLink
            };
            try {
                const response = await fetch('YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL', {
                    method: 'POST',
                    contentType: 'application/json',
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('response').innerText = result.message;
                document.getElementById('applyForm').reset();
            } catch (error) {
                document.getElementById('response').innerText = "Error submitting application.";
            }
        });
    </script>
</body>
</html>
